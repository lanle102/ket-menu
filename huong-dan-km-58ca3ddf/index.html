<style>

function nav(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
function card(p,s){return `<div class="card"><h3>${p.title}</h3><div>${p.shops.map(x=>`<span class="tag">${x}</span>`).join('')}</div>

<li>Máy KHÔNG tự chặn giới hạn theo người → NV tự tuân, ghi vào sổ/nhóm ca: tên người, CT, giờ, bill.</li>

// simulator
let S;const $=i=>document.getElementById(i);

function addI(i){if(i!=S.added||i>=S.p.items.length)return wrong(i<S.p.items.length?'Thêm theo thứ tự gợi ý.':'Món này không có trong bài tập.');S.added++;render()}
function lines(d){return S.p.items.slice(0,S.added).map(i=>`<div class="row"><span>${i[0]}</span><span>${f(i[1])}</span></div>`).join('')+(d?`<div class="row disc"><span>KM: ${S.p.ct}</span><span>-${f(sum()-S.p.total)}</span></div>`:'')}
function tot(d){return `<div class="tot">Tổng: ${f(d?S.p.total:sum())}</div>`}
function flt(q){const L=SHOPS[S.s].cts.filter(x=>x.toLowerCase().includes(q.toLowerCase()));$('ctl').innerHTML=L.map(x=>`<button class="li" onclick="pick(this.textContent)">${x}</button>`).join('')}
function pick(x){if(x!=S.p.ct)return wrong(`Sai chương trình «${x}». Cần chọn «${S.p.ct}».`);S.step=5;render()}
go('chung');
